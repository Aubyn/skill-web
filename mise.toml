# 项目工具链版本 —— 与 mise 全局版本保持一致
# 全局配置见 ~/.config/mise/config.toml（go = latest / node = lts）
# 升级全局后请同步修改此处并执行 `mise install`
[tools]
go = "1.27.4"
node = "26.13.1"
pnpm = "10.34.9"

# ---------------------------- 任务 ----------------------------

[tasks.install]
description = "安装前端依赖"
sources = ["frontend/package.json", "frontend/pnpm-lock.yaml"]
outputs = ["frontend/node_modules/.modules.yaml"]
run = "cd frontend && pnpm install --frozen-lockfile"

[tasks.frontend]
description = "构建前端（输出 frontend/dist）"
depends = ["install"]
run = "cd frontend && pnpm build"

[tasks.build]
description = "构建当前平台二进制 skill-web"
depends = ["frontend"]
run = "go build -o skill-web ."

[tasks.package]
description = "打包发布产物到 dist/（linux/amd64、windows/amd64 + SHA256SUMS）"
depends = ["frontend"]
run = '''
rm -rf dist
mkdir -p dist
CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/skill-web-linux-amd64 .
CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/skill-web-windows-amd64.exe .
cd dist
if command -v sha256sum >/dev/null 2>&1; then
  sha256sum skill-web-linux-amd64 skill-web-windows-amd64.exe > SHA256SUMS
else
  shasum -a 256 skill-web-linux-amd64 skill-web-windows-amd64.exe > SHA256SUMS
fi
echo "打包完成："
ls -lh
'''

[tasks.clean]
description = "清理构建产物"
run = "rm -f skill-web && rm -rf frontend/dist dist"
